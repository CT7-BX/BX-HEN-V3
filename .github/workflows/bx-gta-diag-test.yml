name: BX-GTA v0.7 controller menu test
on:
  push:
    branches: [bx-gta-diag-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test menu state machine (Release + strict warnings)
        run: |
          gcc -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_core.c bx-gta/test_menu.c -o /tmp/bxgta-tests
          /tmp/bxgta-tests
  build-prx:
    needs: host-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm make curl git ca-certificates
      - name: OpenOrbis v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o "$RUNNER_TEMP/sdk.tgz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/sdk.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sdk.tgz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/OpenOrbis/PS4Toolchain/link.x"
          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
      - name: GoldHEN SDK and plugin repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/sdk"
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$RUNNER_TEMP/plugins"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          echo "GOLDHEN_PLUGIN_REPO=$RUNNER_TEMP/plugins" >> "$GITHUB_ENV"
      - name: Build BX-GTA diagnostic PRX
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GOLDHEN_PLUGIN_REPO/plugin_src/BXGTA_menu"
          mkdir -p "$TARGET/source" "$GOLDHEN_PLUGIN_REPO/bin/plugins/prx_final" "$GOLDHEN_PLUGIN_REPO/bin/plugins/elf_final" dist
          cp "$GOLDHEN_PLUGIN_REPO/plugin_src/plugin_template/Makefile" "$TARGET/Makefile"
          cp "$GITHUB_WORKSPACE/bx-gta/main.c" "$TARGET/source/main.c"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_core.c" "$TARGET/source/menu_core.c"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_core.h" "$TARGET/source/menu_core.h"
          make -C "$GOLDHEN_SDK" PRINTF=1
          make -C "$TARGET" all
          cp "$GOLDHEN_PLUGIN_REPO/bin/plugins/prx_final/BXGTA_menu.prx" dist/BXGTA_menu.prx
          test -s dist/BXGTA_menu.prx
          sha256sum dist/BXGTA_menu.prx | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BXGTA-menu-v070-CUSA00419-157
          path: dist/
          if-no-files-found: error

      - name: Publish direct download release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bxgta-menu-v070-cusa00419-v157"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/BXGTA_menu.prx --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/BXGTA_menu.prx --repo "$GITHUB_REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "BX-GTA menu v0.7 - CUSA00419 1.57" \
              --notes "BX-GTA v0.7: experimental GoldHEN notification menu with controller navigation. Gameplay modifications and graphical overlay are not included. Requires physical PS4 test." \
              --latest=false
          fi
