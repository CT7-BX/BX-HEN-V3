name: BX-GTA v1.1 black-red grouped menu build
on:
  push:
    branches: [bx-gta-diag-test]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run portable menu tests with GCC and Clang
        run: |
          set -euo pipefail
          gcc -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_core.c bx-gta/test_menu.c -o /tmp/bxgta-gcc
          /tmp/bxgta-gcc
          gcc -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/feature_catalog.c bx-gta/profile.c bx-gta/palette.c bx-gta/test_features.c -o /tmp/bxgta-features-gcc
          /tmp/bxgta-features-gcc
          clang -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_core.c bx-gta/test_menu.c -o /tmp/bxgta-clang
          /tmp/bxgta-clang
          clang -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/feature_catalog.c bx-gta/profile.c bx-gta/palette.c bx-gta/test_features.c -o /tmp/bxgta-features-clang
          /tmp/bxgta-features-clang
          gcc -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_v1.c bx-gta/synapse_catalog.c bx-gta/test_v1.c -o /tmp/bxgta-v1-gcc
          /tmp/bxgta-v1-gcc
          clang -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_v1.c bx-gta/synapse_catalog.c bx-gta/test_v1.c -o /tmp/bxgta-v1-clang
          /tmp/bxgta-v1-clang
          gcc -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_v2.c bx-gta/synapse_catalog.c bx-gta/test_v2.c -o /tmp/bxgta-v2-gcc
          /tmp/bxgta-v2-gcc
          clang -std=c11 -O2 -DNDEBUG -Wall -Wextra -Werror bx-gta/menu_v2.c bx-gta/synapse_catalog.c bx-gta/test_v2.c -o /tmp/bxgta-v2-clang
          /tmp/bxgta-v2-clang
          python3 bx-gta/test_preview.py
      - name: Sanitizer test
        run: |
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer             bx-gta/menu_core.c bx-gta/test_menu.c -o /tmp/bxgta-san
          /tmp/bxgta-san
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer bx-gta/feature_catalog.c bx-gta/profile.c bx-gta/palette.c bx-gta/test_features.c -o /tmp/bxgta-features-san
          /tmp/bxgta-features-san
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer bx-gta/menu_v1.c bx-gta/synapse_catalog.c bx-gta/test_v1.c -o /tmp/bxgta-v1-san
          /tmp/bxgta-v1-san
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer bx-gta/menu_v2.c bx-gta/synapse_catalog.c bx-gta/test_v2.c -o /tmp/bxgta-v2-san
          /tmp/bxgta-v2-san
  build-prx:
    needs: host-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm make curl git ca-certificates
      - name: OpenOrbis v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -o "$RUNNER_TEMP/sdk.tgz"
          echo '3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  '"$RUNNER_TEMP/sdk.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sdk.tgz" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/OpenOrbis/PS4Toolchain/link.x"
          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
      - name: GoldHEN SDK and plugin repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/sdk"
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$RUNNER_TEMP/plugins"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
          echo "GOLDHEN_PLUGIN_REPO=$RUNNER_TEMP/plugins" >> "$GITHUB_ENV"
      - name: Build BX-GTA v1.1 menu PRX
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$GOLDHEN_PLUGIN_REPO/plugin_src/BXGTA_v2"
          mkdir -p "$TARGET/source" "$GOLDHEN_PLUGIN_REPO/bin/plugins/prx_final" "$GOLDHEN_PLUGIN_REPO/bin/plugins/elf_final" dist
          cp "$GOLDHEN_PLUGIN_REPO/plugin_src/plugin_template/Makefile" "$TARGET/Makefile"
          sed -i '/^LIBS :=/s/$/ -lScePad -lSceUserService/' "$TARGET/Makefile"
          cp "$GITHUB_WORKSPACE/bx-gta/main_v2.c" "$TARGET/source/main.c"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_core.c" "$TARGET/source/menu_core.c"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_core.h" "$TARGET/source/menu_core.h"
          cp "$GITHUB_WORKSPACE/bx-gta/feature_catalog.c" "$TARGET/source/feature_catalog.c"
          cp "$GITHUB_WORKSPACE/bx-gta/feature_catalog.h" "$TARGET/source/feature_catalog.h"
          cp "$GITHUB_WORKSPACE/bx-gta/profile.c" "$TARGET/source/profile.c"
          cp "$GITHUB_WORKSPACE/bx-gta/profile.h" "$TARGET/source/profile.h"
          cp "$GITHUB_WORKSPACE/bx-gta/palette.c" "$TARGET/source/palette.c"
          cp "$GITHUB_WORKSPACE/bx-gta/palette.h" "$TARGET/source/palette.h"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_v1.c" "$TARGET/source/menu_v1.c"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_v1.h" "$TARGET/source/menu_v1.h"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_v2.c" "$TARGET/source/menu_v2.c"
          cp "$GITHUB_WORKSPACE/bx-gta/menu_v2.h" "$TARGET/source/menu_v2.h"
          cp "$GITHUB_WORKSPACE/bx-gta/synapse_catalog.c" "$TARGET/source/synapse_catalog.c"
          cp "$GITHUB_WORKSPACE/bx-gta/synapse_catalog.h" "$TARGET/source/synapse_catalog.h"
          make -C "$GOLDHEN_SDK" PRINTF=1
          make -C "$TARGET" all
          cp "$GOLDHEN_PLUGIN_REPO/bin/plugins/prx_final/BXGTA_v2.prx" dist/BXGTA_v2.prx
          test -s dist/BXGTA_v2.prx
          cp "$GITHUB_WORKSPACE/bx-gta/preview-v2.html" dist/BXGTA-preview.html
          cp "$GITHUB_WORKSPACE/bx-gta/menu_taxonomy_v2.json" dist/BXGTA-options.json
          cat > dist/README.txt <<'README'
          BX-GTA v1.1 PS4 GoldHEN menu scaffold / black and red
          Target: GTA V 1.57 / CUSA00419
          Plugin: /data/GoldHEN/plugins/BXGTA_v2.prx
          plugins.ini [CUSA00419]: /data/GoldHEN/plugins/BXGTA_v2.prx=true
          Remove older BXGTA entries to prevent duplicate plugins.
          L1 + RIGHT: open/close; UP/DOWN: navigate; X select; O back.
          L1 + LEFT: favorite focused action.
          Preferences: /data/GoldHEN/BXGTA/profile0.ini .. profile2.ini
          Error log: /data/GoldHEN/BXGTA/error.log
          Reference catalog metadata from user-supplied Synapse.rar.
          10 sections, 33 submenus, 190 entries. Black/red theme tokens and browser preview.
          The PS4 uses notification-based UI, NOT a graphical GTA overlay.
          GTA actions (spawn, repairs, teleport, camera, server) NOT implemented.
          Themes are data tokens only. Actual PS4 hardware testing pending.
          README
          sha256sum dist/BXGTA_v2.prx | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BXGTA-menu-v110-CUSA00419-157
          path: dist/
          if-no-files-found: error

      - name: Publish direct download release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bxgta-menu-v110-cusa00419-v157"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/BXGTA_v2.prx dist/BXGTA-preview.html dist/BXGTA-options.json dist/README.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/BXGTA_v2.prx dist/BXGTA-preview.html dist/BXGTA-options.json dist/README.txt --repo "$GITHUB_REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "BX-GTA menu v1.1 - CUSA00419 1.57" \
              --notes "BX-GTA v1.1: black-red interface preview with 10 sections, 33 submenus and 190 options. Native GoldHEN plugin handles grouped navigation, core preferences and diagnostics; GTA gameplay effects and actual overlay are not implemented. Physical PS4 test pending." \
              --latest=false
          fi
