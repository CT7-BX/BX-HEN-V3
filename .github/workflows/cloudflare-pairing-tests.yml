name: BX-REMOTE-LINK — Cloudflare pairing backend tests

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-pairing-tests.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-pairing-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pairing-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Worker source and test syntax
        run: |
          node --check cloudflare/pairing-worker.mjs
          node --check cloudflare/tests/pairing-worker.test.mjs
          node --check cloudflare/tests/media-signaling.test.mjs
          node --check cloudflare/tests/native-bridge-command.test.mjs
      - name: Run offline Durable Object pairing tests
        run: node --test cloudflare/tests/*.test.mjs
      - name: Check Worker has no embedded production keys or fake Remote Play
        run: |
          ! grep -q 'BEGIN PRIVATE KEY' cloudflare/pairing-worker.mjs
          grep -q 'ps4Control: false, video: false' cloudflare/pairing-worker.mjs
          ! grep -Eq 'http://[^/ ]+\\.workers\\.dev' cloudflare/pairing-worker.mjs
