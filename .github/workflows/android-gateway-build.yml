name: BX Android Gateway — diagnóstico experimental
on:
  push:
    branches: [main]
    paths:
      - 'android-gateway/**'
      - '.github/workflows/android-gateway-build.yml'
  pull_request:
    paths:
      - 'android-gateway/**'
      - '.github/workflows/android-gateway-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build diagnostics APK
        run: gradle --no-daemon --stacktrace --project-dir android-gateway :app:assembleDebug
      - name: Validate unsigned debug package
        run: |
          test -s android-gateway/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-gateway/app/build/outputs/apk/debug/app-debug.apk > android-gateway/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BX-Android-Gateway-Diagnostic-v0.3
          path: |
            android-gateway/app/build/outputs/apk/debug/app-debug.apk
            android-gateway/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
