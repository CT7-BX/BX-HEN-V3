name: BX-REMOTE-PLAY — Publish verified native OTA release
on:
  workflow_run:
    workflows: ["BX-REMOTE-PLAY — PS4 Native Pairing Proof (Experimental)"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download validated package and check checksum
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage release
          gh run download "$SOURCE_RUN" --repo "$GH_REPO" --name bx-remote-play-native-pairing-untested --dir stage
          input=stage/IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg
          test -s "$input" && test -s stage/pkg.sha256
          expected="$(cut -d' ' -f1 stage/pkg.sha256)"
          actual="$(sha256sum "$input" | cut -d' ' -f1)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] && test "$actual" = "$expected"
          version="$(sed -n 's/^VERSION := //p' native-pair/Makefile)"
          [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}$ ]]
          tag="pair-test-v$version"
          filename="BX-REMOTE-PLAY-Pair-Test-v$version.pkg"
          cp "$input" "release/$filename"
          printf '%s  %s\n' "$actual" "$filename" > release/SHA256SUMS
          printf 'version=%s\ntag=%s\nfilename=%s\nsha256=%s\n' "$version" "$tag" "$filename" "$actual" >> "$GITHUB_OUTPUT"
      - name: Publish immutable public release, or verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.meta.outputs.tag }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          EXPECTED: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir -p previous
            gh release download "$TAG" --repo "$GH_REPO" --pattern "$FILENAME" --dir previous
            echo "$EXPECTED  previous/$FILENAME" | sha256sum -c -
            echo "Matching immutable release already exists."
          else
            gh release create "$TAG" "release/$FILENAME" release/SHA256SUMS \
              --repo "$GH_REPO" --target "$SOURCE_SHA" \
              --title "BX-REMOTE-PLAY Pair Test v${TAG#pair-test-v} (OTA experimental)" \
              --prerelease \
              --notes "Validated by OpenOrbis CI. PS4 OTA download uses pinned GitHub Releases URL and SHA-256 integrity verification. Installing the package from within the currently running app requires user approval and is NOT yet validated on physical PS4. No game streaming, audio or video."
          fi
      - name: Update public version manifest only after release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          EXPECTED: ${{ steps.meta.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GH_REPO/contents/remote/update.txt" --jq '.sha')"
          previous="$(gh api "repos/$GH_REPO/contents/remote/update.txt" --jq '.content' | base64 -d | sed -n 's/^version=//p')"
          if ! python3 - "$previous" "$VERSION" <<'PY'
          import sys
          a,b=sys.argv[1:]
          parse=lambda v:tuple(map(int,v.split('.')))
          if parse(a)>=parse(b):
              raise SystemExit(1)
          PY
          then
            echo "Current manifest is not older. Not overwriting."
            exit 0
          fi
          manifest="$(printf 'title_id=BRPM00001\nversion=%s\nsha256=%s\npkg_url=https://github.com/%s/releases/download/%s/%s\n' "$VERSION" "$EXPECTED" "$GH_REPO" "$TAG" "$FILENAME")"
          encoded="$(printf '%s\n' "$manifest" | base64 -w0)"
          gh api -X PUT "repos/$GH_REPO/contents/remote/update.txt" \
            -f message="chore(ota): point verified PS4 manifest to $TAG" \
            -f content="$encoded" -f sha="$sha" -f branch=main >/dev/null
          gh api -X POST "repos/$GH_REPO/actions/workflows/pages.yml/dispatches" -f ref=main
          echo "Requested Pages deployment after manifest commit."
