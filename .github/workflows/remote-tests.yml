name: BX-REMOTE-PLAY — Interface and Controller Tests

on:
  pull_request:
    paths:
      - ".github/scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
      - "index.html"
      - "remote/**"
      - ".github/workflows/remote-tests.yml"
  push:
    paths:
      - ".github/scripts/build-pages.sh"
      - ".github/workflows/pages.yml"
      - "index.html"
      - "remote/**"
      - ".github/workflows/remote-tests.yml"

permissions:
  contents: read

jobs:
  remote-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate game screen scripts and PWA
        run: |
          node --check remote/game-core.js
          node --check remote/game.js
          node --check remote/media-whep.js
          node --check remote/media-controls.js
          node --check remote/media-source-core.js
          node --check remote/diagnostics.js
          node --check remote/android-readiness.js
          node --check remote/command-center.js
          node --check remote/pkg-updates.js
          node --check remote/bridge-p2p.js
          node --check remote/p2p-sender.js
          node --check remote/p2p-viewer.js
          node --check remote/pair-client.js
          node --check remote/first-tests.js
          node -e "JSON.parse(require('node:fs').readFileSync('remote/manifest.webmanifest', 'utf8'))"
          test -s remote/icon.svg
      - name: Test controller, touch and homepage
        run: node --test remote/tests/*.test.cjs
