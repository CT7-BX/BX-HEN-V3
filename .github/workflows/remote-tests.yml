name: BX-HEN Remote — Controller Tests

on:
  pull_request:
    paths:
      - "remote/**"
      - ".github/workflows/remote-tests.yml"
  push:
    paths:
      - "remote/**"
      - ".github/workflows/remote-tests.yml"

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test controller processing
        run: node --test remote/tests/controller-core.test.cjs
