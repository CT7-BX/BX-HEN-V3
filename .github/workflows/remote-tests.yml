name: BX-HEN Remote — Interface and Controller Tests

on:
  pull_request:
    paths:
      - "index.html"
      - "remote/**"
      - ".github/workflows/remote-tests.yml"
  push:
    paths:
      - "index.html"
      - "remote/**"
      - ".github/workflows/remote-tests.yml"

permissions:
  contents: read

jobs:
  remote-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test controller and homepage
        run: node --test remote/tests/*.test.cjs
