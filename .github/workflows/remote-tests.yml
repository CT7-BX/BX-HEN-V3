name: BX-REMOTE-PLAY — Interface and Controller Tests

on:
  pull_request:
    paths:
      - "index.html"
      - "remote/**"
      - ".github/workflows/remote-tests.yml"
  push:
    paths:
      - "index.html"
      - "remote/**"
      - ".github/workflows/remote-tests.yml"

permissions:
  contents: read

jobs:
  remote-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate game screen scripts and PWA
        run: |
          node --check remote/game-core.js
          node --check remote/game.js
          node -e "JSON.parse(require('node:fs').readFileSync('remote/manifest.webmanifest', 'utf8'))"
          test -s remote/icon.svg
      - name: Test controller, touch and homepage
        run: node --test remote/tests/*.test.cjs
