name: BX-REMOTE-PLAY — PS4 Native Pairing Proof (Experimental)

on:
  push:
    branches: [main]
    paths:
      - "native-pair/**"
      - "ps4-agent/resident/**"
      - "ps4-agent/tools/make_icon.py"
      - "ps4-agent/tests/**"
      - ".github/workflows/native-pair-build.yml"
  pull_request:
    paths:
      - "native-pair/**"
      - "ps4-agent/resident/**"
      - "ps4-agent/tools/make_icon.py"
      - "ps4-agent/tests/**"
      - "relay/**"
      - "remote/pair-client.js"
      - ".github/workflows/native-pair-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-pair:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Portable protocol and private config unit tests
        run: |
          set -e
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            native-pair/pair_protocol.c native-pair/tests/protocol_test.c -o /tmp/bx-pair-protocol
          /tmp/bx-pair-protocol
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            native-pair/pair_protocol.c native-pair/pair_config.c native-pair/tests/config_test.c -o /tmp/bx-pair-config
          /tmp/bx-pair-config
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            native-pair/native_diag.c native-pair/tests/native_diag_test.c -o /tmp/bx-native-diag
          /tmp/bx-native-diag
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            native-pair/pair_retry.c native-pair/tests/pair_retry_test.c -o /tmp/bx-pair-retry
          /tmp/bx-pair-retry
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            native-pair/update_manifest.c native-pair/tests/update_manifest_test.c -o /tmp/bx-update-manifest
          /tmp/bx-update-manifest
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            native-pair/sha256.c native-pair/tests/sha256_test.c -o /tmp/bx-sha256
          /tmp/bx-sha256
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Inative-pair/tests/stubs -Dmkdir=bx_test_mkdir -Dremove=bx_test_remove \
            native-pair/ota_download.c native-pair/sha256.c native-pair/tests/ota_timeout_test.c \
            -o /tmp/bx-ota-timeout
          /tmp/bx-ota-timeout
          node --check native-pair/tools/generate_setup.mjs
          node --test native-pair/tests/generate_setup.test.mjs
          python3 -m unittest discover -s ps4-agent/tests -p 'test_*.py' -v
          python3 -m unittest discover -s native-pair/tests -p 'test_*.py' -v

      - name: Install compiler and linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld ca-certificates

      - name: Download pinned OpenOrbis
        shell: bash
        run: |
          set -euo pipefail
          SDK_URL="https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 20 -o /tmp/openorbis.tar.gz "$SDK_URL"
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis.tar.gz" | sha256sum -c -
          mkdir -p /tmp/openorbis
          tar -xzf /tmp/openorbis.tar.gz -C /tmp/openorbis
          test -f /tmp/openorbis/OpenOrbis/PS4Toolchain/link.x
          echo "OO_PS4_TOOLCHAIN=/tmp/openorbis/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

      - name: Compile experimental pairing eboot
        run: make -C native-pair eboot PS4_CC=clang PS4_LD=ld.lld

      - name: Prepare OpenOrbis package tools
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Stage SDK support files and deterministic RGB icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-pair/sce_sys/about native-pair/sce_module
          for item in \
            'right.sprx:sce_sys/about/right.sprx' \
            'libc.prx:sce_module/libc.prx' \
            'libSceFios2.prx:sce_module/libSceFios2.prx'; do
            IFS=: read -r name destination <<< "$item"
            source="$(find "$OO_PS4_TOOLCHAIN" -type f -name "$name" -print -quit)"
            test -n "$source" || exit 1
            cp "$source" "native-pair/$destination"
          done
          python3 ps4-agent/tools/make_icon.py native-pair/sce_sys/icon0.png

      - name: Verify pairing PKG metadata
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          make -C native-pair sce_sys/param.sfo
          python3 native-pair/tools/verify_native_pkg.py \
            native-pair/sce_sys/param.sfo native-pair/sce_sys/icon0.png

      - name: Build and validate experimental pairing PKG
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
        run: |
          make -C native-pair pkg PS4_CC=clang PS4_LD=ld.lld
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate \
            native-pair/IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg

      - name: Verify embedded resident ELF
        run: |
          test -s native-pair/bx-remote-service.elf
          readelf -h native-pair/bx-remote-service.elf | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          ! grep -q 'payloads.ini' native-pair/resident_install.c

      - name: Record digest
        run: |
          test -s native-pair/IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg
          sha256sum native-pair/IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg \
            | tee native-pair/pkg.sha256

      - name: Upload experimental PKG — not tested on hardware
        uses: actions/upload-artifact@v4
        with:
          name: bx-remote-play-native-pairing-untested
          path: |
            native-pair/IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg
            native-pair/pkg.sha256
            native-pair/bx-remote-service.elf
          retention-days: 30

  release-native:
    name: Publish verified PS4 v0.25 prerelease
    needs: native-pair
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bx-remote-play-native-pairing-untested
          path: _ps4_release
      - name: Validate PKG checksum and package name
        shell: bash
        run: |
          set -euo pipefail
          cd _ps4_release
          test -s IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg
          test -s pkg.sha256
          test -s bx-remote-service.elf
          EXPECTED="$(awk 'NR==1 {print $1}' pkg.sha256)"
          printf '%s  %s\n' "$EXPECTED" "IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg" | sha256sum -c -
          mv IV0000-BRPM00001_00-BXREMOTEPAIR0001.pkg BX-REMOTE-PLAY-Pair-Test-v0.25.pkg
          sha256sum BX-REMOTE-PLAY-Pair-Test-v0.25.pkg > BX-REMOTE-PLAY-Pair-Test-v0.25.sha256
      - name: Publish optional experimental prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="pair-test-v0.25"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Will not overwrite published binaries."
            exit 0
          fi
          gh release create "$TAG" \
            _ps4_release/BX-REMOTE-PLAY-Pair-Test-v0.25.pkg \
            _ps4_release/BX-REMOTE-PLAY-Pair-Test-v0.25.sha256 \
            _ps4_release/bx-remote-service.elf \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "BX-REMOTE-PLAY PS4 v0.25 — diagnostico e estabilidade" \
            --notes "Build CI OpenOrbis validado, mas ainda nao testado em PS4 fisico. Painel nativo com etapas e dicas de erro, menos redesenhos, log local seguro e ELF de diagnostico opcional atualizado. Sem streaming de jogos nem injeção de controle. Encerre a instancia ELF antiga antes de instalar novamente pelo TRIANGULO."
