name: Publicar BX-REMOTE-PLAY no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static player files only
        run: bash .github/scripts/build-pages.sh _site
      - name: Verify deploy content
        run: |
          test -s _site/index.html
          test -s _site/remote/game.js
          test -s _site/remote/site-v2.css
          test -s _site/remote/site-ui.js
          test -s _site/remote/command-center.js
          test -s _site/remote/command-center.css
          test -s _site/remote/pkg-updates.js
          test -s _site/remote/bridge.html
          test -s _site/remote/gateway.html
          test -s _site/remote/android-readiness.js
          test -s _site/remote/bridge-p2p.js
          test -s _site/remote/input-transport.js
          test -s _site/remote/p2p-sender.js
          test -s _site/remote/p2p-viewer.js
          test -s _site/remote/media-whep.js
          test -s _site/remote/media-controls.js
          test -s _site/remote/media-source-core.js
          test -s _site/remote/diagnostics.js
          test -s _site/remote/update.txt
          test -s _site/remote/ps4-probe.txt
          test ! -e _site/relay/server.mjs
          test ! -e _site/ps4-agent/main.c
          test ! -e _site/.github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
