<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="robots" content="index,follow">
  <title>BX-HEN Remote Play</title>
  <meta name="description" content="BX-HEN Remote Play: plataforma experimental de acesso remoto ao PS4, com prioridade ao controle físico.">
  <meta http-equiv="refresh" content="0; url=./remote/">
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0e;color:#f3f0f2}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{max-width:460px;border:1px solid #60303d;border-radius:18px;background:#211820;padding:30px;text-align:center}
    strong{color:#ed2d49}
    h1{margin:0 0 12px}
    p{color:#c8bac0;line-height:1.6}
    a{color:white;background:#c82443;display:inline-block;padding:12px 18px;border-radius:10px;font-weight:700}
    a:focus-visible{outline:3px solid #ff8ca4;outline-offset:3px}
  </style>
  <script>
    // Preserve the original /remote/ location while the service is prototyped.
    window.location.replace(new URL("./remote/", document.baseURI).href);
  </script>
</head>
<body>
  <main>
    <h1>BX-<strong>HEN</strong> Remote</h1>
    <p>O projeto agora tem como foco exclusivo o controle e acesso remoto ao PS4. A transmissão ainda está em desenvolvimento.</p>
    <a href="./remote/">Abrir BX-HEN Remote</a>
  </main>
</body>
</html>
