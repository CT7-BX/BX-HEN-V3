plugins {
    id 'com.android.application'
}
android {
    namespace 'com.ct7bx.gateway'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ct7bx.gateway'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0-diagnostic'
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
